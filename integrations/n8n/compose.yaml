services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.30.4
    container_name: talon-full-demo-n8n
    # Talon binds only to host loopback. Linux host networking lets the workflow
    # reach it without exposing Talon; n8n also remains bound to loopback.
    # This replaces the bridge-only mapping "127.0.0.1:5678:5678".
    network_mode: host
    environment:
      TZ: Europe/Warsaw
      GENERIC_TIMEZONE: Europe/Warsaw
      N8N_LISTEN_ADDRESS: 127.0.0.1
      N8N_PORT: 5678
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: internal
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /demo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      TALON_N8N_SESSION_ID: ${TALON_N8N_SESSION_ID:-n8n-quarterly-demo}
      TALON_N8N_GATEWAY_URL: ${TALON_N8N_GATEWAY_URL:-http://127.0.0.1:8080}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../cases/quarterly-report:/demo/input:ro
      - ../../.state/n8n-output:/demo/output
      - ../../.state/n8n-config:/demo/config
volumes:
  n8n_data:
