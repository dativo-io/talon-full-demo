# Existing workforce stack, with Talon introduced as a separate policy boundary.
# UI cannot mount DuckDB or connect directly to the privileged HR service.
#
# The HR MCP server is the AI use case's trusted MCP action source. It listens
# on 127.0.0.1 inside the network namespace owned by hr-mcp-net, shared with
# talon-mcp and the opt-in talon-gateway. Both Talon processes load the HR
# action catalog at startup, so BOTH need the same loopback source address.
# Nothing else on app_net can reach the private HR listener on port 9091.
# The application reaches governed MCP at talon-mcp:8080 and, in LIVE mode,
# the LLM gateway at talon-gateway:8082 (two DNS aliases of hr-mcp-net).
name: hr-copilot-isolated

x-case-image: &case-image
  build:
    context: .
    dockerfile: Dockerfile
  image: hr-copilot-synthetic:local

x-talon-image: &talon-image
  build:
    context: .
    dockerfile: Dockerfile.talon
  image: hr-copilot-talon-runtime:local

x-talon-environment: &talon-environment
  TALON_DATA_DIR: /state
  HOME: /state
  TALON_SECRETS_KEY: ${HR_DEMO_SECRETS_KEY:?Set the vault/signing keys in .env}
  TALON_SIGNING_KEY: ${HR_DEMO_SIGNING_KEY:?Set the vault/signing keys in .env}
  TALON_ADMIN_KEY: ${HR_DEMO_ADMIN_KEY:?Set the vault/signing keys in .env}

x-talon-volumes: &talon-volumes
  - ./.state/talon:/state
  - ./:/case:ro
  - ./.state/policy:/policies:ro
  - ${HR_DEMO_TALON_BIN:?Supply absolute Talon binary path}:/usr/local/bin/talon:ro

services:
  seed:
    <<: *case-image
    command: ["python", "warehouse.py", "seed"]
    environment:
      HR_DEMO_DB_PATH: /data/hr.duckdb
    volumes: [hr_data:/data]
    networks: [private_hr]
    restart: "no"

  # Owns the network namespace shared by hr-server and both Talon data-plane
  # services. Aliases make the two public Talon ports reachable from the app
  # without exposing the loopback-only HR backend.
  hr-mcp-net:
    <<: *case-image
    command: ["sleep", "infinity"]
    networks:
      app_net:
        aliases: [talon-mcp, talon-gateway]
    restart: unless-stopped

  hr-server:
    <<: *case-image
    command: ["python", "demo.py", "hr"]
    depends_on:
      seed:
        condition: service_completed_successfully
      hr-mcp-net:
        condition: service_started
    environment:
      HR_DEMO_DB_PATH: /data/hr.duckdb
      # Loopback only: reachable from talon-mcp (same namespace), not app_net.
      DEMO_BIND_HOST: 127.0.0.1
    volumes: [hr_data:/data:ro]
    network_mode: "service:hr-mcp-net"
    # talon serve discovers its MCP action source at startup and refuses to
    # start if it cannot; talon-mcp waits for this check.
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:9091/debug/counters', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  dashboard:
    <<: *case-image
    command: ["python", "demo.py", "dashboard"]
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      HR_DEMO_DB_PATH: /data/hr.duckdb
      DEMO_BIND_HOST: 0.0.0.0
    volumes: [hr_data:/data:ro]
    networks: [app_net]
    restart: unless-stopped

  # A normal Talon CLI environment; initialization is never scripted by Compose.
  talon-cli:
    <<: *talon-image
    profiles: ["setup"]
    user: "${HR_DEMO_UID:-1000}:${HR_DEMO_GID:-1000}"
    environment: *talon-environment
    volumes: *talon-volumes
    working_dir: /state
    command: ["talon", "version"]
    networks: [app_net]
    restart: "no"

  # Native talon serve: the governed MCP endpoint POST /mcp for the AI use
  # case in /state/agent.talon.yaml (its actions.sources and definitions).
  talon-mcp:
    <<: *talon-image
    user: "${HR_DEMO_UID:-1000}:${HR_DEMO_GID:-1000}"
    depends_on:
      hr-server:
        condition: service_healthy
    environment: *talon-environment
    volumes: *talon-volumes
    working_dir: /state
    command: ["talon", "serve", "--host", "0.0.0.0", "--port", "8080"]
    network_mode: "service:hr-mcp-net"
    restart: unless-stopped

  # LIVE-mode gateway loads the same /state/agent.talon.yaml, including HR
  # source discovery. If it ran on app_net, 127.0.0.1:9091 would resolve
  # INSIDE the gateway's own container and startup would fail with ECONNREFUSED.
  # Share the HR namespace just like talon-mcp, preserving loopback isolation.
  talon-gateway:
    <<: *talon-image
    user: "${HR_DEMO_UID:-1000}:${HR_DEMO_GID:-1000}"
    profiles: ["live"]
    depends_on:
      hr-server:
        condition: service_healthy
    environment: *talon-environment
    volumes: *talon-volumes
    working_dir: /state
    command: ["talon", "serve", "--host", "0.0.0.0", "--port", "8082", "--gateway", "--gateway-config", "/policies/gateway.talon.yaml"]
    network_mode: "service:hr-mcp-net"
    restart: unless-stopped

  # Talon operator console: separate read-only process, NOT the Workforce UI.
  # It sees the same signed evidence and policy files as MCP/gateway, but has
  # no route to the private HR network and receives no admin/vault credentials.
  talon-ui:
    <<: *talon-image
    profiles: ["operator"]
    user: "${HR_DEMO_UID:-1000}:${HR_DEMO_GID:-1000}"
    depends_on:
      talon-mcp:
        condition: service_started
    environment:
      TALON_DATA_DIR: /state
      HOME: /state
      TALON_SIGNING_KEY: ${HR_DEMO_SIGNING_KEY:?Set the evidence signing key in .env}
    # SQLite WAL readers can need writable directory access; Talon opens the
    # database read-only. Never mount /case: it contains the secret-bearing .env.
    volumes:
      - ./.state/talon:/state
      - ./.state/policy:/policies:ro
      - ${HR_DEMO_TALON_BIN:?Supply absolute Talon binary path}:/usr/local/bin/talon:ro
    working_dir: /state
    command:
      - talon
      - ui
      - serve
      - --listen
      - 0.0.0.0:8787
      - --allow-non-loopback
      - --gateway-config
      - /policies/gateway.talon.yaml
    networks: [app_net]
    ports: ["127.0.0.1:8787:8787"]
    restart: unless-stopped

  ui:
    <<: *case-image
    command: ["python", "demo.py", "ui"]
    depends_on:
      talon-mcp:
        condition: service_started
      dashboard:
        condition: service_started
    environment:
      DEMO_BIND_HOST: 0.0.0.0
      TALON_URL: http://talon-mcp:8080
      TALON_AGENT_KEY: talon-hr-demo-key-0001
      HR_DASHBOARD_URL: http://dashboard:9093
      HR_MOCK_URL: ""
      HR_DEMO_TRACE: "1"
      HR_DEMO_PROVIDER_KIND: "openai-via-talon-when-live"
      HR_DEMO_TRACE_PAYLOADS: ${HR_DEMO_TRACE_PAYLOADS:-0}
      TALON_AI_MODE: ${HR_DEMO_AI_MODE:-guided}
      TALON_LLM_URL: http://talon-gateway:8082/v1/proxy/openai/v1/chat/completions
    networks: [app_net]
    ports: ["127.0.0.1:8501:8501"]
    restart: unless-stopped

volumes:
  hr_data:

networks:
  app_net:
    driver: bridge
  # Only the one-shot seed job uses it; it has no route anywhere.
  private_hr:
    driver: bridge
    internal: true
