# Demonstration-only agent policy for People Analytics AI.
# One identity is used for both the Talon LLM gateway and Talon's governed MCP
# endpoint (POST /mcp). The HR backend is this use case's trusted MCP action
# source; every tool the app may call is declared below as an action.
# The employee export is declared (so it is governed, not unknown) but
# forbidden: remove it from capabilities.forbidden_tools to enable it.
agent:
  name: hr-analytics-assistant
  description: Synthetic People Analytics aggregate assistant
  version: 1.0.0
  model_tier: 1
  key:
    secret_name: hr-analytics-assistant-talon-key

capabilities:
  allowed_tools:
    - hr_attrition_summary
    - hr_headcount_summary
    - hr_tenure_summary
    - hr_aggregate_sql
    - hr_employee_export
  # Hidden from MCP discovery and denied before dispatch when called by name.
  forbidden_tools:
    - hr_employee_export
  forbidden_patterns:
    - ".env"
    - "secrets"
    - "credentials"

actions:
  sources:
    hr:
      type: mcp
      # Plaintext http is accepted for loopback only. In the isolated Compose
      # topology the HR service shares Talon's network namespace and listens
      # on 127.0.0.1, so the same URL holds there.
      url: "http://127.0.0.1:9091/mcp"
  definitions:
    # Aggregate reads with no side effect: read_only lets an allowed call run
    # in one MCP request. Policy still decides every call.
    hr_attrition_summary:
      source: hr
      read_only: true
      review: {fields: [months, department]}
    hr_headcount_summary:
      source: hr
      read_only: true
      review: {fields: [department]}
    hr_tenure_summary:
      source: hr
      read_only: true
      review: {fields: [department]}
    # The HR backend itself validates the SQL against approved aggregate
    # shapes; a query it rejects after dispatch is an unknown outcome, never a
    # Talon denial.
    hr_aggregate_sql:
      source: hr
      read_only: true
      review: {fields: [sql]}
    # Employee-level export: consequential (prepared, then executed by
    # operation id) whenever policy allows it at all.
    hr_employee_export:
      source: hr
      review: {fields: [scope]}

policies:
  cost_limits:
    per_request: 1.0
    daily: 10.0
    monthly: 100.0
  # Per-session maximum spend is independent of the daily/monthly agent caps.
  session_limits:
    max_cost: 0.10
  data_classification:
    input_scan: true
    output_scan: true
    redact_pii: false
  model_routing:
    tier_0:
      primary: gpt-4o-mini
      location: any
    tier_1:
      primary: gpt-4o-mini
      location: any
    tier_2:
      primary: gpt-4o-mini
      location: any

audit:
  log_level: detailed
  retention_days: 30
  include_prompts: false
  include_responses: false

metadata:
  department: people-analytics
  owner: demo-operator
  tags:
    - synthetic
    - governed
