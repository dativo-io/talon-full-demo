name: n8n-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  clean-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Pull pinned n8n image
        run: docker pull docker.n8n.io/n8nio/n8n:2.30.4
      - name: Import, execute, export, and clean-import workflow
        run: make n8n-validate
