name: Shopify support against current Talon main plus historical RC2 control

# RC2 tag maps to an immutable source commit. This lane builds and exercises
# that exact commit; it is NOT the verified release archive or image.
#
# People Analytics consumer per candidate (exact Full Demo SHAs, recorded in
# the job summary): RC2 predates governed MCP and runs Full Demo main's
# proxy-based case as the CONTROL; Current Talon main removes the MCP proxy and runs
# the migrated consumer (verified governed-MCP HR consumer). #589 against the
# unmigrated case is an expected break (--proxy-config refused), not a test.
# Independent steps run even when an earlier one failed, so a blocked step
# never hides the others; each is gated only on its own prerequisites.
on:
  pull_request:
    paths:
      - 'integrations/n8n/shopify-support/**'
      - '.github/workflows/shopify-core-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-main-reference:
    name: Pinned source ${{ matrix.candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - candidate: rc2-tag-source
            sha: 3f3f20dff910dc2416c8d82467de2d4e2dd8acc5
            pa_consumer: e7fadfc3f84a3f768afa7b91b73ca85b317c051b  # Full Demo main: proxy-based People Analytics (control)
            orderdesk: 79f500e43c21d7691e8c829334b510d88c4dd3ce    # #45 head, unmodified bridge (control)
          - candidate: main-latest
            sha: main
            pa_consumer: main
            orderdesk: main
    steps:
      - name: Check out Full Demo PR
        uses: actions/checkout@v4
        with:
          path: full-demo
          persist-credentials: false
      - name: Check out exact reviewed Talon candidate commit
        uses: actions/checkout@v4
        with:
          repository: dativo-io/talon
          ref: ${{ matrix.sha }}
          path: talon
          persist-credentials: false
      - name: Check out the People Analytics consumer for this candidate
        uses: actions/checkout@v4
        with:
          repository: dativo-io/talon-full-demo
          ref: ${{ matrix.pa_consumer }}
          path: pa-consumer
          persist-credentials: false
      - name: Check out the real OrderDesk consumer for this candidate
        uses: actions/checkout@v4
        with:
          repository: dativo-io/talon-full-demo
          ref: ${{ matrix.orderdesk }}
          path: orderdesk
          persist-credentials: false
      - name: Record resolved producer and consumer revisions
        run: |
          set -euo pipefail
          resolved_sha="$(git -C talon rev-parse HEAD)"
          echo "TALON_CORE_SHA=$resolved_sha" >> "$GITHUB_ENV"
          {
            echo "Talon candidate: ${{ matrix.candidate }} $resolved_sha"
            echo "People Analytics consumer: $(git -C pa-consumer rev-parse HEAD)"
            echo "OrderDesk consumer: $(git -C orderdesk rev-parse HEAD)"
            echo "Full Demo PR checkout: $(git -C full-demo rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ matrix.sha }}" != "main" ]]; then
            test "$resolved_sha" = "${{ matrix.sha }}"
          fi
          # The current-main lane must use fresh consumers, not old candidate heads.
          if [[ "${{ matrix.pa_consumer }}" != "main" ]]; then
            test "$(git -C pa-consumer rev-parse HEAD)" = "${{ matrix.pa_consumer }}"
          fi
          if [[ "${{ matrix.orderdesk }}" != "main" ]]; then
            test "$(git -C orderdesk rev-parse HEAD)" = "${{ matrix.orderdesk }}"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: talon/go.mod
          cache: true
          cache-dependency-path: talon/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build source for selected historical or current-main lane, without claiming released artifact
        id: build
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev
          (cd talon && go build -o "$RUNNER_TEMP/talon" ./cmd/talon/)
          "$RUNNER_TEMP/talon" version
          sha256sum "$RUNNER_TEMP/talon"
      - name: Execute Full Demo Shopify Stage A and canonical actions against candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TALON_EXTERNAL_BIN: ${{ runner.temp }}/talon
          N8N_IMAGE: docker.n8n.io/n8nio/n8n:2.48.5
          TALON_CORE_DIR: ${{ github.workspace }}/talon
        run: bash full-demo/integrations/n8n/shopify-support/test-n8n.sh
      - name: Install independent People Analytics fixture dependencies
        id: pa_deps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 -m pip install -r pa-consumer/cases/people-analytics-copilot/requirements.txt
      - name: Real candidate People Analytics MCP, gateway, tools and signed evidence
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.pa_deps.outcome == 'success' }}
        env:
          PATH: ${{ runner.temp }}:/usr/local/bin:/usr/bin:/bin
        run: bash pa-consumer/scripts/test-people-analytics-talon.sh
      - name: Real OrderDesk synthetic PostgreSQL and Talon Action Gateway host preflight
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TALON_CLI: ${{ runner.temp }}/talon
        run: |
          bash orderdesk/cases/claude-postgres-incident/validate-fixture.sh
          bash orderdesk/cases/claude-postgres-incident/validate-talon-actions.sh
          echo 'OrderDesk HOST-KEY preflight passed. OpenShell C01–C12 is NOT RUN.' >> "$GITHUB_STEP_SUMMARY"
      - name: OrderDesk bridge per-intent operation identity against the candidate (real Talon, restarted bridge)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TALON_CLI: ${{ runner.temp }}/talon
        run: |
          if [ ! -f orderdesk/cases/claude-postgres-incident/validate-bridge-intents.sh ]; then
            echo 'OrderDesk bridge intents: NOT APPLICABLE (this consumer revision has the argument-derived bridge)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          (cd orderdesk && make incident-bridge-intents)
          echo 'OrderDesk bridge intents passed against the candidate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Independent Document Processing admission contract on same candidate
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TALON_BIN: ${{ runner.temp }}/talon
          TALON_TOKEN_CONTRACT_MODE: core-main
        run: |
          cd full-demo
          make tokeneconomizer-contract
      - name: Install core-reference n8n 2.48.5
        id: n8n_install
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/n8n"
          cd "$RUNNER_TEMP/n8n"
          npm install --ignore-scripts --no-audit --no-fund --loglevel=error n8n@2.48.5
          npm rebuild sqlite3
          test "$(./node_modules/.bin/n8n --version | tail -n1)" = "2.48.5"
      - name: Execute native canonical action integration and independent counts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.n8n_install.outcome == 'success' }}
        env:
          N8N_BIN: ${{ runner.temp }}/n8n/node_modules/.bin/n8n
          TALON_BIN: ${{ runner.temp }}/talon
        run: |
          cd talon
          bash scripts/n8n-refund-live.sh 2>&1 | tee "$RUNNER_TEMP/core-n8n-proof.log"
          grep -E '^(PASS|FAIL)' "$RUNNER_TEMP/core-n8n-proof.log" >> "$GITHUB_STEP_SUMMARY"
