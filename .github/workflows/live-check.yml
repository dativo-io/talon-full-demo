name: live-check

# Test the real Talon MCP/session-budget engine against current Talon main.
# Git checkout resolves one immutable SHA per job; record it for provenance.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the demo
        uses: actions/checkout@v4
        with:
          path: talon-full-demo

      - name: Check out dativo-io/talon main
        uses: actions/checkout@v4
        with:
          repository: dativo-io/talon
          ref: main
          path: talon

      - name: Set up Go (matching Talon's toolchain)
        uses: actions/setup-go@v5
        with:
          go-version-file: talon/go.mod
          cache: true

      - name: Verify runner dependencies and record core provenance
        run: |
          command -v jq
          echo "Talon main: $(git -C talon rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Run make live-check against current Talon main
        working-directory: talon-full-demo
        env:
          TALON_REPO: ${{ github.workspace }}/talon
          # Checkout is main@run-start; no fixed-SHA constraint.
        run: make live-check

      - name: Build and verify the presenter CLI
        working-directory: talon-full-demo
        run: |
          rm -rf .state/talon-audit-cli
          source scripts/resolve-talon-audit.sh
          audit_bin="$(resolve_talon_audit_bin "$PWD")"
          test -x "$audit_bin"
          "$audit_bin" audit export --help | grep -Fq -- '--session'
          "$audit_bin" audit export --help | grep -Fq -- 'signed-json'
          "$audit_bin" audit verify --help | grep -Fq -- '--file'
