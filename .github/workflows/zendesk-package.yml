name: zendesk-package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZENDESK_SUBDOMAIN: ${{ secrets.ZENDESK_SUBDOMAIN }}
      ZENDESK_OAUTH_TOKEN: ${{ secrets.ZENDESK_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package inspection dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip libsecret-1-dev
      - name: Build and inspect credential-free private-app ZIP
        run: make zendesk-package
      - name: Run official authenticated ZCLI validation when repository secrets exist
        if: ${{ env.ZENDESK_SUBDOMAIN != '' && env.ZENDESK_OAUTH_TOKEN != '' }}
        run: make zendesk-zcli-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talon-reply-assistant-zendesk-app
          path: .state/zendesk-app/
          if-no-files-found: error
