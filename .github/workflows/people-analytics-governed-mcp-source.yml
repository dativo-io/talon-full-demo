name: People Analytics against current Talon main

# Real HR MCP server as the use case's trusted MCP action source, Talon's
# governed MCP endpoint (talon#431) and a synthetic model upstream; no paid
# inference. Checkout latest core main at run time and record its SHA.
# Source-built proof is not published-binary/release acceptance.
on:
  pull_request:
    paths:
      - 'cases/people-analytics-copilot/**'
      - '.github/workflows/people-analytics-governed-mcp-source.yml'
      - 'scripts/test-people-analytics-talon.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merged-main-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: full-demo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dativo-io/talon
          ref: main
          path: talon
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: talon/go.mod
          cache: true
          cache-dependency-path: talon/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the current Talon main commit used in this run
        run: echo "Talon main source: $(git -C talon rev-parse HEAD) (source-built, not a release)" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile checked-out current main and record checksum
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev jq
          (cd talon && go build -o "$RUNNER_TEMP/talon" ./cmd/talon/)
          "$RUNNER_TEMP/talon" version
          sha256sum "$RUNNER_TEMP/talon"
      - name: Install existing HR fixture dependencies
        run: python3 -m pip install -r full-demo/cases/people-analytics-copilot/requirements.txt
      - name: Unit, documentation and model-loop checks
        run: cd full-demo/cases/people-analytics-copilot && python3 -m unittest discover -p 'test_*.py' -v
      - name: Governed MCP, policy reload, model policy, independent HR counters and signed evidence
        env:
          PATH: ${{ runner.temp }}:/usr/local/bin:/usr/bin:/bin
        run: bash full-demo/scripts/test-people-analytics-talon.sh
      - name: Explicit proof boundary
        if: ${{ !cancelled() }}
        run: |
          echo 'PASS = synthetic HR consumer on the governed-MCP merged main SOURCE. NOT RUN = published binary/image, Compose isolation (ci.yml job), paired seven-area Console, LIVE paid model.' >> "$GITHUB_STEP_SUMMARY"
