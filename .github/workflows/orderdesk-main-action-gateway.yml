name: OrderDesk exact merged-main Action Gateway acceptance (#589)

# Real PostgreSQL 16 staging outage + deterministic bridge identity and native HTTP Action Gateway,
# exact merged Talon #589 main source. This lane is NOT C01-C12 OpenShell/Claude acceptance.
# Historical RC2 proof is preserved in orderdesk-rc2-source.yml.
on:
  pull_request:
    paths:
      - 'cases/claude-postgres-incident/**'
      - '.github/workflows/orderdesk-main-action-gateway.yml'
      - 'scripts/real-openshell.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  merged-main-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TALON_MAIN_COMMIT: 156188dea65cb6feab01aa92093a00e7717a6dd6
    steps:
      - uses: actions/checkout@v4
        with:
          path: full-demo
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: dativo-io/talon
          ref: 156188dea65cb6feab01aa92093a00e7717a6dd6
          path: talon
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: talon/go.mod
          cache: true
          cache-dependency-path: talon/go.sum
      - name: Verify exact merged Talon main checkout
        run: |
          git -C talon rev-parse HEAD
          test "$(git -C talon rev-parse HEAD)" = "$TALON_MAIN_COMMIT"
          echo 'MERGED MAIN SOURCE TEST at exact 156188d, NOT A PUBLISHED RELEASE' >> "$GITHUB_STEP_SUMMARY"
      - name: Compile pinned main and record binary checksum
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev jq
          (cd talon && go build -o "$RUNNER_TEMP/talon" ./cmd/talon/)
          "$RUNNER_TEMP/talon" version
          sha256sum "$RUNNER_TEMP/talon"
      - name: Validate actual PostgreSQL outage and staging recovery
        run: bash full-demo/cases/claude-postgres-incident/validate-fixture.sh
      - name: Verify Action Gateway denial, independent approval, claim and signed lifecycle
        env:
          TALON_CLI: ${{ runner.temp }}/talon
        run: bash full-demo/cases/claude-postgres-incident/validate-talon-actions.sh
      - name: Verify durable independent bridge intents, replay and unknown outcomes
        env:
          TALON_CLI: ${{ runner.temp }}/talon
        run: |
          (cd full-demo && make incident-bridge-intents)
          echo 'PASS: bridge per-intent ids, restart, review, conflict, UNKNOWN, independent counts and signatures' >> "$GITHUB_STEP_SUMMARY"
      - name: Record limits
        run: |
          {
            echo 'PASS if previous jobs are green: independent PostgreSQL 16 fixture, source-built exact merged main Action Gateway, durable bridge-intents.'
            echo 'NOT RUN: real Claude Code/OpenShell same-hop C01–C12, published main binary, paid model, live production.'
          } >> "$GITHUB_STEP_SUMMARY"
