name: Full Demo source and documentation integration

# All four customer PRs are in main. Check the actual current PR/main tree
# for navigation, buyer evidence boundaries, fixture contracts and Go/Python tests.
on:
  pull_request:
    paths:
      - '.github/workflows/acme-integration-rehearsal.yml'
      - 'docs/**'
      - 'README.md'
      - 'README_LEGACY.md'
      - 'scripts/check-demo-coherence.py'
      - 'scripts/check-repo-navigation.py'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the actual branch/PR merge-ref under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify canonical landing, source links and evidence claims
        run: |
          python3 scripts/check-repo-navigation.py
          echo "Tested Full Demo commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Require a consistent customer journey and evidence labels
        run: |
          python3 scripts/check-acme-proof-contract.py
          python3 scripts/check-demo-coherence.py
          node integrations/n8n/shopify-support/workflow.test.cjs
          bash -n integrations/n8n/shopify-support/test-n8n.sh
          bash -n integrations/n8n/shopify-support/test-current-main-actions.sh
          python3 -m py_compile integrations/n8n/shopify-support/fixture.py
          python3 cases/people-analytics-copilot/test_docs.py -v
      - name: Prepare existing HR local validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
          python3 -m pip install -r cases/people-analytics-copilot/requirements.txt
      - name: Build/test merged repository without live external systems
        run: |
          make validate-local
      - name: Report precisely what was and wasn't run
        run: |
          {
            echo 'PASS = exact checked-out branch/main source, canonical local navigation and source/fixture test contracts.'
            echo 'NOT RUN here: real Talon, Claude/OpenShell C01-C12, paid provider or real Shopify/payment. Run acme-governed-main-acceptance for actual four-case governance.'
            echo 'Published RC2 compatibility is separate from current-main source-built integration.'
          } >> "$GITHUB_STEP_SUMMARY"
