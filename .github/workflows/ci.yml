name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Verify vendor policy released-schema compatibility
        run: bash scripts/test-vendor-policy-compatibility.sh
      - name: Validate TokenEconomizer coding fixtures (no credentials, no model calls)
        run: make tokeneconomizer-validate
      - name: Run repository CI contract
        run: make ci

  talon-main-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install verified Talon main commit (not a floating release)
        run: |
          go install github.com/dativo-io/talon/cmd/talon@cef6313c42a44ab9ab64de0e879147bf50370ea3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Exercise Talon budget, gateway and signed-evidence contract without paid models
        run: make tokeneconomizer-contract
