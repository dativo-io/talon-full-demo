name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Verify vendor policy released-schema compatibility
        run: bash scripts/test-vendor-policy-compatibility.sh
      - name: Validate TokenEconomizer coding fixtures (no credentials, no model calls)
        run: make tokeneconomizer-validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HR analytics dependencies
        run: python -m pip install -r cases/people-analytics-copilot/requirements.txt
      - name: Run repository CI contract
        run: make ci
      - name: Test People Analytics DuckDB and model tool-loop
        run: make people-analytics-validate

  talon-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install latest reviewed Talon stable release
        run: |
          TALON_RELEASE="$(cat config/tokeneconomizer-talon-release.txt)"
          go install "github.com/dativo-io/talon/cmd/talon@${TALON_RELEASE}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/talon" version
      - name: Exercise released Talon budget, gateway and signed-evidence contract without paid models
        run: make tokeneconomizer-contract

  people-analytics-talon-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workforce metrics dependencies
        run: python -m pip install -r cases/people-analytics-copilot/requirements.txt
      - name: Install pinned Talon release
        run: |
          TALON_RELEASE="$(cat config/tokeneconomizer-talon-release.txt)"
          go install "github.com/dativo-io/talon/cmd/talon@$TALON_RELEASE"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/talon" version
      - name: Verify real Talon MCP boundary with synthetic HR service and signed evidence
        run: bash scripts/test-people-analytics-talon.sh

  people-analytics-isolation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install pinned Talon for the container network proof
        run: |
          TALON_RELEASE="$(cat config/tokeneconomizer-talon-release.txt)"
          go install "github.com/dativo-io/talon/cmd/talon@$TALON_RELEASE"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          echo "HR_DEMO_TALON_BIN=$(go env GOPATH)/bin/talon" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test tooling
        run: |
          python -m pip install "playwright==1.55.0"
          # Hosted Ubuntu runners ship with Google Chrome. Reuse it to avoid
          # repeated system package and Chromium downloads on every PR.
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "HR_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Build and start separated People Analytics services
        run: bash scripts/people-analytics-isolated.sh up
      - name: Verify direct-access baseline and governed non-bypass
        run: bash scripts/people-analytics-isolated.sh verify
      - name: Terminal E2E — original backend counters and signed evidence
        run: |
          CASE="$PWD/cases/people-analytics-copilot"
          dc() { docker compose -f "$CASE/compose.isolated.yaml" --env-file "$CASE/.state/isolated.env" "$@"; }
          dc exec -T ui python3 verify_isolation.py boundary
          dc exec -T ui python3 verify_isolation.py discover
          dc exec -T ui python3 verify_isolation.py allow
          dc exec -T ui python3 verify_isolation.py deny
          dc exec -T hr-server python3 verify_isolation.py backend-counts
          dc exec -T talon-mcp talon audit export --format signed-json --session hr-demo-presenter --output /tmp/hr-presenter-evidence.json
          dc exec -T talon-mcp talon audit verify --file /tmp/hr-presenter-evidence.json
      - name: Browser E2E — single workforce UI, SQL, HR validator and Talon denial
        run: python scripts/test-people-analytics-browser.py
      - name: Policy flip E2E — identical SQL, permission changed, verified evidence
        run: python scripts/test-people-analytics-policy-change.py
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: people-analytics-browser-failure
          path: cases/people-analytics-copilot/.state/browser-failure.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop isolated demo
        if: always()
        run: bash scripts/people-analytics-isolated.sh down
