name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq
      - name: Verify vendor policy released-schema compatibility
        run: bash scripts/test-vendor-policy-compatibility.sh
      - name: Validate TokenEconomizer coding fixtures (no credentials, no model calls)
        run: make tokeneconomizer-validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install HR analytics dependencies
        run: python -m pip install -r cases/people-analytics-copilot/requirements.txt
      - name: Run repository CI contract
        run: make ci
      - name: Test People Analytics DuckDB and model tool-loop
        run: make people-analytics-validate

  talon-release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.10"
          cache: false
      - name: Install latest reviewed Talon stable release
        run: |
          TALON_RELEASE="$(cat config/tokeneconomizer-talon-release.txt)"
          go install "github.com/dativo-io/talon/cmd/talon@${TALON_RELEASE}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/talon" version
      - name: Exercise released Talon budget, gateway and signed-evidence contract without paid models
        run: make tokeneconomizer-contract

  # Resolve current Talon main at checkout time; print its SHA for auditability.
  # Source-built acceptance does NOT verify a published release artifact.
  people-analytics-talon-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dativo-io/talon
          ref: main
          path: .talon-src
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .talon-src/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install workforce metrics dependencies
        run: python -m pip install -r cases/people-analytics-copilot/requirements.txt
      - name: Build Talon main and record resolved source
        run: |
          echo "People Analytics Talon main: $(git -C .talon-src rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/talon-bin"
          (cd .talon-src && go build -o "$RUNNER_TEMP/talon-bin/talon" ./cmd/talon)
          echo "$RUNNER_TEMP/talon-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/talon-bin/talon" version
          sha256sum "$RUNNER_TEMP/talon-bin/talon"
      - name: Verify executable against checked-out Talon main before HR policy test
        env:
          HR_DEMO_TALON_SOURCE_DIR: ${{ github.workspace }}/.talon-src
        run: bash scripts/check-people-analytics-talon-binary.sh "$RUNNER_TEMP/talon-bin/talon"
      - name: Verify Talon's governed MCP endpoint with the synthetic HR service and signed evidence
        run: bash scripts/test-people-analytics-talon.sh

  people-analytics-isolation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dativo-io/talon
          ref: main
          path: .talon-src
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: .talon-src/go.mod
          cache: false
      - name: Build Talon main for isolated Compose test
        run: |
          echo "People Analytics Compose Talon main: $(git -C .talon-src rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/talon-bin"
          (cd .talon-src && go build -o "$RUNNER_TEMP/talon-bin/talon" ./cmd/talon)
          echo "$RUNNER_TEMP/talon-bin" >> "$GITHUB_PATH"
          echo "HR_DEMO_TALON_BIN=$RUNNER_TEMP/talon-bin/talon" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/talon-bin/talon" version
      - name: Verify executable against checked-out Talon main before Compose
        env:
          HR_DEMO_TALON_SOURCE_DIR: ${{ github.workspace }}/.talon-src
        run: bash scripts/check-people-analytics-talon-binary.sh "$RUNNER_TEMP/talon-bin/talon"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser test tooling
        run: |
          python -m pip install "playwright==1.55.0"
          # Hosted Ubuntu runners ship with Google Chrome. Reuse it to avoid
          # repeated system package and Chromium downloads on every PR.
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
            echo "HR_BROWSER_CHANNEL=chrome" >> "$GITHUB_ENV"
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Start existing DuckDB and HR analytics services
        run: |
          cd cases/people-analytics-copilot
          umask 077
          mkdir -p .state/policy .state/talon
          printf 'HR_DEMO_SECRETS_KEY=%s\nHR_DEMO_SIGNING_KEY=%s\nHR_DEMO_ADMIN_KEY=%s\nHR_DEMO_UID=%s\nHR_DEMO_GID=%s\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" "$(openssl rand -hex 24)" "$(id -u)" "$(id -g)" > .env
          cp gateway.talon.yaml .state/policy/gateway.talon.yaml
          docker compose -f compose.isolated.yaml up --build -d seed hr-server dashboard
      - name: Initialize and configure released Talon with its actual CLI
        run: |
          cd cases/people-analytics-copilot
          docker compose -f compose.isolated.yaml run --rm talon-cli test -s /etc/ssl/certs/ca-certificates.crt
          docker compose -f compose.isolated.yaml run --rm talon-cli talon init --scaffold --name hr-analytics-assistant
          cp agent.talon.yaml .state/talon/agent.talon.yaml
          docker compose -f compose.isolated.yaml run --rm talon-cli talon validate
          docker compose -f compose.isolated.yaml run --rm talon-cli talon secrets set hr-analytics-assistant-talon-key talon-hr-demo-key-0001
      - name: Start Talon's governed MCP endpoint and the existing workforce browser
        run: |
          cd cases/people-analytics-copilot
          docker compose -f compose.isolated.yaml up --no-deps -d talon-mcp
          docker compose -f compose.isolated.yaml up --no-deps --build -d ui
          for i in {1..40}; do
            if docker compose -f compose.isolated.yaml exec -T ui python3 -c "from urllib.request import urlopen; urlopen('http://talon-mcp:8080/health', timeout=2)" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose -f compose.isolated.yaml exec -T ui python3 -c "from urllib.request import urlopen; urlopen('http://talon-mcp:8080/health', timeout=2)"
      - name: LIVE gateway Compose startup — same private HR source, independent app-facing port (mock key, no model requests)
        run: |
          set -euo pipefail
          cd cases/people-analytics-copilot
          # The gateway also compiles /state/agent.talon.yaml and must discover
          # HR at 127.0.0.1:9091. A previous app_net-only Compose placement
          # made it restart forever even while talon-mcp worked.
          docker compose -f compose.isolated.yaml run --rm talon-cli talon secrets set openai-api-key sk-hr-ci-fake-provider-no-network-requests
          docker compose -f compose.isolated.yaml --profile live up --no-deps -d talon-gateway
          for i in {1..40}; do
            if docker compose -f compose.isolated.yaml exec -T ui python3 -c "from urllib.request import urlopen; urlopen('http://talon-gateway:8082/health', timeout=2)" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          docker compose -f compose.isolated.yaml exec -T ui python3 -c "from urllib.request import urlopen; print('PASS: Talon LIVE gateway health via app_net alias:', urlopen('http://talon-gateway:8082/health', timeout=2).status)"
          docker compose -f compose.isolated.yaml --profile live ps talon-gateway
      - name: Verify existing HR boundary and Talon enforcement
        run: |
          cd cases/people-analytics-copilot
          docker compose -f compose.isolated.yaml exec -T hr-server python3 verify_isolation.py baseline
          docker compose -f compose.isolated.yaml exec -T ui python3 verify_isolation.py app
          docker compose -f compose.isolated.yaml exec -T hr-server python3 verify_isolation.py backend-counts
          docker compose -f compose.isolated.yaml exec -T talon-mcp talon audit export --format signed-json --session hr-demo-isolated-boundary --output /tmp/hr-boundary-evidence.json
          docker compose -f compose.isolated.yaml exec -T talon-mcp talon audit verify --file /tmp/hr-boundary-evidence.json
      - name: Verify independent HR counters and signed Talon evidence
        run: |
          cd cases/people-analytics-copilot
          docker compose -f compose.isolated.yaml exec -T ui python3 verify_isolation.py boundary
          docker compose -f compose.isolated.yaml exec -T ui python3 verify_isolation.py discover
          docker compose -f compose.isolated.yaml exec -T ui python3 verify_isolation.py allow
          docker compose -f compose.isolated.yaml exec -T ui python3 verify_isolation.py deny
          docker compose -f compose.isolated.yaml exec -T hr-server python3 verify_isolation.py backend-counts
          # The real Talon session rollup is the source of truth for tool decisions.
          docker compose -f compose.isolated.yaml run --rm talon-cli talon audit list --session hr-demo-proof-checks
          docker compose -f compose.isolated.yaml run --rm talon-cli talon costs --session hr-demo-proof-checks --json
          docker compose -f compose.isolated.yaml run --rm talon-cli talon audit verify --session hr-demo-proof-checks
          docker compose -f compose.isolated.yaml exec -T talon-mcp talon audit export --format signed-json --session hr-demo-proof-checks --output /tmp/hr-check.json
          docker compose -f compose.isolated.yaml exec -T talon-mcp talon audit verify --file /tmp/hr-check.json
      - name: Browser E2E — single workforce UI, SQL, HR validator and Talon denial
        run: python scripts/test-people-analytics-browser.py
      - name: Policy flip E2E — identical SQL, permission changed, verified evidence
        run: python scripts/test-people-analytics-policy-change.py
      - name: Native Operations Console paired browser — seven areas, MCP readiness and signed HR records
        run: python scripts/test-people-analytics-operator-console.py
      - name: Upload browser failure screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: people-analytics-browser-failure
          path: cases/people-analytics-copilot/.state/browser-failure.png
          if-no-files-found: ignore
          retention-days: 3
      - name: Stop isolated demo
        if: always()
        run: docker compose -f cases/people-analytics-copilot/compose.isolated.yaml --profile live down

  # Real, disposable PostgreSQL fixture — distinct from Talon/OpenShell
  # authorization proof. No API keys or external infrastructure credentials.
  claude-incident-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check the exact action/MCP transport contract offline
        run: make incident-contract-test
      - name: Validate real PostgreSQL 28P01 and fixed staging-only reconciliation
        run: make incident-fixture-validate
  
  # Real, pinned, publicly published Talon HTTP Action Gateway. Authenticated
  # host agent-key preflight; NOT the sandbox workload-hop acceptance.
  claude-incident-talon-api-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install SHA256-verified official Talon v1.17.0-rc.2 for incident action contract
        run: |
          set -euo pipefail
          INCIDENT_TALON_RELEASE="$(cat cases/claude-postgres-incident/TALON_RELEASE)"
          [[ "$INCIDENT_TALON_RELEASE" == "v1.17.0-rc.2" ]] || exit 1
          archive=talon_1.17.0-rc.2_linux_amd64.tar.gz
          curl -fsSL --retry 3 "https://github.com/dativo-io/talon/releases/download/$INCIDENT_TALON_RELEASE/$archive" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' 5ba2021a7da0ad704a4c3b21e319e05b96fa0347d7d43318ed30bead357ba47c "$RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rc2-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/rc2-bin" talon
          "$RUNNER_TEMP/rc2-bin/talon" version | tee "$RUNNER_TEMP/rc2-version.txt"
          head -n1 "$RUNNER_TEMP/rc2-version.txt" | grep -Fx 'Talon 1.17.0-rc.2'
          sha256sum "$RUNNER_TEMP/rc2-bin/talon"
          echo "$RUNNER_TEMP/rc2-bin" >> "$GITHUB_PATH"
      - name: Real Talon policy + external approval + dispatch against synthetic PostgreSQL
        run: make incident-talon-preflight
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bridge durable per-intent operation ids against the same real Talon (no Docker)
        run: TALON_CLI="$RUNNER_TEMP/rc2-bin/talon" make incident-bridge-intents
